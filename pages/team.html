  <style>
    /* ─────────────────────────────────────────
       HORIZONTAL ACCORDION
       Collapsed artists are narrow strips with their name running
       vertically. Opening one lets it take the remaining width while
       the others squeeze aside.

       The name is a single absolutely-positioned element per panel. Its
       collapsed and open positions are both expressed relative to the
       panel, so a plain CSS transition carries it from vertical-in-strip
       to horizontal-beside-the-photo - no JS measuring, and it travels
       naturally as the panel resizes.
       ───────────────────────────────────────── */
    .acc {
      /* One easing + duration drives every part of the open/close move,
         so the panel, the photo, the name and the copy all travel on the
         same curve and land together. easeOutQuint: quick to commit,
         long gentle settle - reads much softer than ease-in-out. */
      --dur:  0.9s;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --strip: 88px;
      --info-pad: 58px;
      /* Keep the photo box a shade narrower than the source photos'
         2:3 (0.667) ratio at every viewport height, so `cover` only ever
         trims the sides - never the top of a head. The 43vh tracks the
         72vh panel height; 450px matches the 760px cap. Both must move
         together if the panel height below changes. */
      --photo-w: clamp(220px, min(34%, 43vh), 450px);

      display: flex;
      height: 72vh; min-height: 540px; max-height: 760px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }

    .acc-panel {
      position: relative;
      flex: 0 0 var(--strip);
      overflow: hidden;
      cursor: pointer;
      border-left: 1px solid var(--border);
      background: var(--bg); padding: 0; margin: 0;
      text-align: left; color: inherit; font: inherit;
      transition: flex-basis var(--dur) var(--ease);
      will-change: flex-basis;
      contain: paint;
    }
    .acc-panel:first-child { border-left: none; }
    .acc-panel.open { flex: 1 1 auto; cursor: default; }
    .acc-panel:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

    /* ── PHOTO ──
       Collapsed, the photo fills the narrow strip. Open, its box is
       capped to a portrait-ish width: the box ratio always stays
       NARROWER than the source photos (2:3), so `cover` scales to the
       box height and can only ever trim the sides - never the top of
       someone's head. Widen --photo-w and faces start getting cut. */
    .acc-photo {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      transition: right var(--dur) var(--ease);
    }
    .acc-panel.open .acc-photo {
      right: auto;
      width: var(--photo-w);
    }
    .acc-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 18%;   /* per-artist override set inline */
    }

    /* Dimming is done with an overlay's opacity rather than an animated
       filter - filter on nine large images repaints every frame and is
       what made the old transition feel hard. */
    .acc-veil {
      position: absolute; inset: 0; pointer-events: none;
      background: color-mix(in srgb, var(--shade) 78%, transparent);
      opacity: 1;
      transition: opacity var(--dur) var(--ease);
    }
    .acc-panel:hover .acc-veil { opacity: 0.82; }
    .acc-panel.open .acc-veil { opacity: 0; }

    /* Feathers the photo's right edge into the panel background so the
       info column always sits on solid colour. */
    .acc-fade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to right,
        transparent 0%,
        transparent 18%,
        color-mix(in srgb, var(--bg) 70%, transparent) 30%,
        var(--bg) 42%);
      opacity: 0;
      transition: opacity var(--dur) var(--ease);
    }
    .acc-panel.open .acc-fade { opacity: 1; }

    /* ── the morphing name ── */
    .acc-name {
      position: absolute;
      z-index: 3;
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      color: var(--cream);
      pointer-events: none;

      /* collapsed: centred in the strip, reading bottom-to-top */
      left: calc(var(--strip) / 2);
      top: 50%;
      font-size: 21px;
      transform: translate(-50%, -50%) rotate(-90deg);
      transform-origin: center center;

      transition:
        left      var(--dur) var(--ease),
        top       var(--dur) var(--ease),
        font-size var(--dur) var(--ease),
        transform var(--dur) var(--ease);
    }
    /* open: horizontal, sitting just right of the photo */
    .acc-panel.open .acc-name {
      left: calc(var(--photo-w) + var(--info-pad));
      top: 72px;
      font-size: clamp(42px, 4.6vw, 74px);
      transform: translate(0, 0) rotate(0deg);
    }

    /* ghost name behind, echoing the artist pages' outlined lettering */
    .acc-ghost {
      position: absolute; top: 4px; right: 0;
      left: calc(var(--photo-w) + var(--info-pad));
      z-index: 1;
      font-family: var(--font-display);
      font-size: clamp(90px, 13vw, 190px); font-weight: 700;
      color: transparent;
      -webkit-text-stroke: 1px var(--accent-wash);
      line-height: 0.85; letter-spacing: -0.04em;
      white-space: nowrap; overflow: hidden;
      pointer-events: none; user-select: none;
      opacity: 0; transition: opacity 0.6s ease 0.15s;
    }
    .acc-panel.open .acc-ghost { opacity: 1; }

    /* ── info column, only meaningful when open ── */
    .acc-info {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      left: var(--photo-w);
      z-index: 2;
      /* top padding reserves the space the name lands in */
      padding: 168px var(--info-pad) 44px var(--info-pad);
      display: flex; flex-direction: column; justify-content: flex-start;
      overflow-y: auto;
      opacity: 0;
      transform: translateX(14px);
      pointer-events: none;
      transition: opacity 0.42s ease, transform 0.42s var(--ease);
    }
    .acc-panel.open .acc-info {
      opacity: 1; transform: none; pointer-events: auto;
      /* lands just after the name finishes travelling */
      transition-delay: 0.34s;
    }
    .acc-role {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .acc-role::before {
      content: ''; display: block; width: 32px; height: 1px;
      background: var(--gold); flex-shrink: 0;
    }
    .acc-style {
      font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 22px; margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .acc-bio p {
      font-family: var(--font-accent);
      font-size: 16px; line-height: 1.78;
      color: color-mix(in srgb, var(--muted) 92%, transparent);
      margin-bottom: 10px;
    }
    .acc-bio p:last-child { margin-bottom: 0; }
    .acc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
    .acc-actions .btn-gold { font-size: 11px; padding: 11px 24px; letter-spacing: 0.12em; }
    .btn-ig {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--font-body);
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 10px 20px;
      color: var(--muted); border: 1px solid var(--border);
      background: transparent; transition: color 0.2s, border-color 0.2s;
    }
    .btn-ig:hover { color: var(--gold-lt); border-color: var(--gold); }

    /* hint chevron on collapsed strips */
    .acc-hint {
      position: absolute; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      z-index: 3; color: var(--gold);
      font-size: 13px; opacity: 0.55;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .acc-panel.open .acc-hint { opacity: 0; }
    .acc-panel:hover .acc-hint { opacity: 1; }

    /* ── GALLERY (below the accordion, follows the open artist) ── */
    .gallery-header {
      padding: 46px 80px 0;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 20px; margin-bottom: 26px;
    }
    .gallery-count { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
    .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .gallery-cell {
      aspect-ratio: 1; overflow: hidden;
      background: var(--bg3); cursor: pointer; position: relative;
    }
    .gallery-cell img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.5s ease, filter 0.3s ease;
      filter: brightness(0.92) saturate(0.9);
    }
    .gallery-cell:hover img { transform: scale(1.07); filter: brightness(1) saturate(1.1); }
    .gallery-cell-overlay {
      position: absolute; inset: 0; background: transparent; transition: background 0.3s;
    }
    .gallery-cell:hover .gallery-cell-overlay { background: color-mix(in srgb, var(--bg) 20%, transparent); }
    .gallery-status {
      padding: 64px 80px; text-align: center;
      font-family: var(--font-accent); font-size: 17px;
      color: var(--muted); font-style: italic;
    }
    .gallery-pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 34px 80px; border-top: 1px solid var(--border);
    }
    .page-btn {
      font-family: var(--font-body);
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 10px 24px; cursor: pointer;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { color: var(--cream); border-color: var(--gold); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-numbers { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .page-num {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--muted); cursor: pointer;
      border: 1px solid transparent; transition: all 0.2s;
    }
    .page-num:hover { color: var(--cream); }
    .page-num.active { color: var(--gold-lt); border-color: var(--gold); background: var(--accent-wash); }

    /* ── LIGHTBOX (neutral on purpose) ── */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .lightbox.active { display: flex; }
    .lb-img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
    .lb-close {
      position: absolute; top: 24px; right: 32px;
      font-size: 28px; color: rgba(255,255,255,0.5);
      cursor: pointer; background: none; border: none; transition: color 0.2s;
    }
    .lb-close:hover { color: #fff; }
    .lb-prev, .lb-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 40px; color: rgba(255,255,255,0.3);
      cursor: pointer; background: none; border: none; padding: 20px; transition: color 0.2s;
    }
    .lb-prev { left: 8px; } .lb-next { right: 8px; }
    .lb-prev:hover, .lb-next:hover { color: rgba(255,255,255,0.9); }
    .lb-counter {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 12px; letter-spacing: 0.15em; color: rgba(255,255,255,0.4);
    }

    @media (max-width: 1200px) {
      .acc {
        --strip: 74px;
        --info-pad: 38px;
        --photo-w: clamp(190px, min(32%, 41vh), 400px);
      }
      .acc-info { padding-top: 148px; }
      .acc-panel.open .acc-name { top: 62px; }
      .gallery-header, .gallery-pagination, .gallery-status { padding-left: 28px; padding-right: 28px; }
    }

    /* ── Narrow screens: the accordion turns vertical ──
       Strips stack as full-width rows with horizontal names; opening one
       expands it downward. Same interaction, workable on a phone.

       Threshold maths: 7 collapsed strips at 74px eat 518px, and the open
       panel needs roughly 600px (190px photo + a readable info column).
       So the horizontal layout only works above ~1100px. Below that it was
       squeezing the info column to a couple of hundred pixels - which is
       exactly what an unfolded foldable (~884px) and any iPad were getting. */
    @media (max-width: 1100px) {
      .acc {
        /* height of the photo banner on an open panel */
        --mphoto: min(46vh, 360px);
        flex-direction: column;
        height: auto; max-height: none; min-height: 0;
      }
      .acc-panel {
        flex: 0 0 62px;
        border-left: none;
        border-top: 1px solid var(--border);
      }
      .acc-panel:first-child { border-top: none; }
      /* sizes to its content - a fixed 76vh left big empty gaps under
         short bios and cramped long ones */
      .acc-panel.open { flex: 0 0 auto; min-height: 0; }

      /* Collapsed row: photo fills the 62px strip behind the name. */
      .acc-photo { position: absolute; inset: 0; width: auto; height: auto; }

      /* Open: the photo becomes a banner in normal flow and the copy sits
         BELOW it on solid background. Overlaying text on the portrait is
         what read as squished on a phone - the picture was stretched to
         the full panel height and the bio floated on top of a face. */
      .acc-panel.open .acc-photo {
        position: relative;
        inset: auto;
        width: 100%; height: var(--mphoto);
      }
      .acc-panel.open .acc-photo img { object-position: 50% 20%; }

      .acc-name {
        left: 24px; top: 50%;
        transform: translate(0, -50%) rotate(0deg);
        font-size: 19px;
      }
      /* name sits on the bottom of the banner, just above the copy */
      .acc-panel.open .acc-name {
        left: 24px;
        top: calc(var(--mphoto) - 58px);
        font-size: clamp(30px, 8vw, 40px);
        transform: none;
      }
      .acc-info {
        position: static;
        left: auto; width: auto; height: auto;
        padding: 24px 24px 34px;
        overflow: visible;
        background: var(--bg);
      }
      .acc-role { margin-bottom: 12px; }
      .acc-style { padding-bottom: 16px; margin-bottom: 16px; }
      .acc-bio p { font-size: 15.5px; line-height: 1.7; }
      .acc-actions { margin-top: 20px; }
      .acc-actions .btn-gold, .btn-ig { flex: 1 1 auto; justify-content: center; text-align: center; }

      /* fade only the foot of the banner so the name stays legible */
      .acc-panel.open .acc-fade {
        top: calc(var(--mphoto) - 150px);
        bottom: auto; left: 0; right: 0; height: 150px;
        background: linear-gradient(to bottom, transparent, var(--bg));
      }
      .acc-ghost { display: none; }
      .acc-hint { bottom: auto; top: 50%; left: auto; right: 20px; transform: translateY(-50%) rotate(90deg); }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      .acc-panel, .acc-name, .acc-info, .acc-photo, .acc-veil, .acc-fade, .acc-ghost {
        transition-duration: 0.01ms !important;
      }
    }
  </style>

          'He enjoys creating bold, colorful anime tattoos and traditional designs, showcasing his artistic talent.',
          'In his free time, Remy likes playing video games, drawing, watching anime, and reading manga.',
          "Remy is a friendly and fun person who takes his work seriously. You won't regret choosing him as your tattoo artist."
        ]
      },
      {
        slug: 'eathan', name: 'Eathan', photo: 'eathan.jpg', ig: 'haleboy.tattoos',
        role: 'Apprentice',
        style: 'Apprentice · Growing Every Day',
        folder: 'eathan', prefix: 'eathan',
        bio: [
          'Eathan is the enthusiastic and dedicated apprentice over at our tattoo studio, honing his skills every day.',
          'Eathan enjoys a challenge himself with his drawing, as well as commissions he receives.',
          'He always brings cheer to the shop, with his infectious laughter and sense of humor.',
          'Recently, he began tattooing on skin under guidance, and he is excited to proceed with the career of his dreams.',
          'If you would like to get tattooed by Eathan, please keep in mind that he is still in the learning phase and the tattoos he offers are considered apprentice level.',
          'However, every opportunity he gets to improve, he wholeheartedly embraces, eager to grow and develop his craft.'
        ]
      },
      {
        slug: 'zoie', name: 'Zoie', photo: 'zoie.jpg', ig: 'kittystabz',
        // her photo sits right-of-centre; nudge the crop window across
        // so she reads centred in the strip. Raise to move her further left.
        pos: '64% 18%',
        role: 'Apprentice · Resident Piercer',
        style: 'Tiny Tattoos · Apprentice',
        folder: 'zoie tattoo', prefix: 'zoietattoo',
        bio: [
          'Zoie, our newest apprentice, is new to the art of tattooing, but she brings with her over seven years of invaluable experience in the industry.',
          'She officially joined our dedicated team in February 2024.',
          "Zoie is diligently working her way toward becoming our shop's tiny tattoo specialist, with a focus on creating precise, beautiful designs.",
          'Her commitment is evident as she works hard to learn and perfect her skills in tiny tattooing.',
          'We invite you to book a session with her today and become a part of her exciting artistic journey.'
        ]
      }
    ];

    var PER_PAGE  = 12;
    var BATCH     = 10;
    var MAX_INDEX = 80;
    var ARROW     = '→';
    var IG_SVG    = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';

    var byId = function (id) { return document.getElementById(id); };
    var acc      = byId('acc');
    var grid     = byId('g-grid');
    var statusEl = byId('g-status');
    var countEl  = byId('g-count');
    var pagEl    = byId('g-pagination');

    var current = null;
    var images  = [];
    var page    = 0;
    var cache   = {};

    /* ── Build the strips ── */
    ARTISTS.forEach(function (a, i) {
      var p = document.createElement('button');
      p.className = 'acc-panel';
      p.type = 'button';
      p.id = 'panel-' + a.slug;
      p.setAttribute('aria-expanded', 'false');
      p.setAttribute('aria-label', a.name);

      var esc = function (s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      };

      p.innerHTML =
        '<div class="acc-photo"><img src="../images/artists/' + a.photo + '" alt="" ' +
          'style="object-position:' + (a.pos || '50% 18%') + '" ' +
          'onerror="this.style.visibility=\'hidden\'"></div>' +
        '<div class="acc-veil"></div>' +
        '<div class="acc-fade"></div>' +
        '<div class="acc-ghost" aria-hidden="true">' + esc(a.name) + '</div>' +
        '<h2 class="acc-name">' + esc(a.name) + '</h2>' +
        '<div class="acc-hint" aria-hidden="true">›</div>' +
        '<div class="acc-info">' +
          '<div class="acc-role">' + esc(a.role) + '</div>' +
          '<div class="acc-style">' + esc(a.style) + '</div>' +
          '<div class="acc-bio">' + a.bio.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div>' +
          '<div class="acc-actions">' +
            '<a class="btn-gold" href="booking.html">' +
              esc('Consult with ' + a.name) + ' ' + ARROW + '</a>' +
            '<a class="btn-ig" href="https://instagram.com/' + a.ig + '" target="_blank" rel="noopener">' +
              IG_SVG + '@' + esc(a.ig) + '</a>' +
          '</div>' +
        '</div>';

      // Clicks inside the open panel (links) must not re-trigger the panel.
      p.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        open(a.slug, true);
      });
      p.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        var nxt = ARTISTS[(i + d + ARTISTS.length) % ARTISTS.length];
        open(nxt.slug, true);
        byId('panel-' + nxt.slug).focus();
      });

      acc.appendChild(p);
    });

    /* ── Open a panel ── */
    function open(slug, pushHash) {
      var a = null;
      for (var i = 0; i < ARTISTS.length; i++) {
        if (ARTISTS[i].slug === slug) { a = ARTISTS[i]; break; }
      }
      if (!a || a === current) return;
      current = a;

      ARTISTS.forEach(function (x) {
        var el = byId('panel-' + x.slug);
        var on = x.slug === slug;
        el.classList.toggle('open', on);
        el.setAttribute('aria-expanded', on ? 'true' : 'false');
        // links in closed panels shouldn't be tabbable
        el.querySelectorAll('a').forEach(function (link) {
          link.tabIndex = on ? 0 : -1;
        });
      });

      if (pushHash && history.replaceState) history.replaceState(null, '', '#' + slug);

      byId('g-title').textContent = a.name + "'s work";
      loadGallery(a);
    }

    /* ── Gallery discovery ──
       Photos are numbered <prefix>_001.jpg up, starting at 002 with no
       gaps. Probe in batches and stop once a batch comes back empty, so
       adding a photo still "just works" without firing 80 requests per
       artist. Only the open artist is ever probed; results are cached. */
    function loadGallery(a) {
      images = []; page = 0;
      grid.innerHTML = '';
      pagEl.style.display = 'none';
      countEl.textContent = '';

      if (cache[a.slug]) { images = cache[a.slug]; finish(a); return; }

      statusEl.style.display = 'block';
      statusEl.textContent = 'Loading gallery…';

      var found = [], start = 1, emptyStreak = 0;

      function probeBatch() {
        if (current !== a) return;
        if (start > MAX_INDEX) return done();

        var end = Math.min(start + BATCH - 1, MAX_INDEX);
        var pending = end - start + 1;
        var hits = 0;

        for (var i = start; i <= end; i++) {
          (function (idx) {
            var src = '../images/tattoo galleries/' + a.folder + '/' +
                      a.prefix + '_' + String(idx).padStart(3, '0') + '.jpg';
            var probe = new Image();
            probe.onload  = function () { found.push({ idx: idx, src: src }); hits++; if (--pending === 0) step(); };
            probe.onerror = function () { if (--pending === 0) step(); };
            probe.src = src;
          })(i);
        }

        function step() {
          if (hits === 0) {
            emptyStreak++;
            if (emptyStreak >= (found.length ? 1 : 2)) return done();
          } else emptyStreak = 0;
          start = end + 1;
          probeBatch();
        }
      }

      function done() {
        if (current !== a) return;
        found.sort(function (x, y) { return x.idx - y.idx; });
        images = found.map(function (f) { return f.src; });
        cache[a.slug] = images;
        finish(a);
      }

      probeBatch();
    }

    function finish(a) {
      if (!images.length) {
        statusEl.style.display = 'block';
        statusEl.textContent = 'Gallery coming soon - follow @' + a.ig + ' for the latest.';
        return;
      }
      statusEl.style.display = 'none';
      countEl.textContent = images.length + ' photo' + (images.length === 1 ? '' : 's');
      renderPage(0);
      if (images.length > PER_PAGE) { pagEl.style.display = 'flex'; renderNumbers(); }
    }

    function renderPage(p) {
      page = p;
      grid.innerHTML = '';
      var start = p * PER_PAGE, end = Math.min(start + PER_PAGE, images.length);
      for (var i = start; i < end; i++) {
        (function (src, pos) {
          var cell = document.createElement('div');
          cell.className = 'gallery-cell';
          var img = document.createElement('img');
          img.src = src; img.loading = 'lazy';
          img.alt = current.name + ' tattoo';
          var ov = document.createElement('div');
          ov.className = 'gallery-cell-overlay';
          cell.appendChild(img); cell.appendChild(ov);
          cell.addEventListener('click', function () { openLb(pos); });
          grid.appendChild(cell);
        })(images[i], i);
      }
      byId('g-prev').disabled = page === 0;
      byId('g-next').disabled = page >= Math.ceil(images.length / PER_PAGE) - 1;
    }

    function renderNumbers() {
      var pages = Math.ceil(images.length / PER_PAGE);
      var box = byId('g-numbers');
      box.innerHTML = '';
      for (var p = 0; p < pages; p++) {
        (function (pg) {
          var b = document.createElement('div');
          b.className = 'page-num' + (pg === page ? ' active' : '');
          b.textContent = pg + 1;
          b.addEventListener('click', function () { renderPage(pg); renderNumbers(); });
          box.appendChild(b);
        })(p);
      }
    }

    byId('g-prev').addEventListener('click', function () {
      if (page > 0) { renderPage(page - 1); renderNumbers(); grid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    byId('g-next').addEventListener('click', function () {
      if (page < Math.ceil(images.length / PER_PAGE) - 1) { renderPage(page + 1); renderNumbers(); grid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });

    /* ── Lightbox ── */
    var lb = byId('lightbox'), lbImg = byId('lb-img'), lbCount = byId('lb-counter');
    var lbIdx = 0;
    function openLb(i) { lbIdx = i; show(); lb.classList.add('active'); }
    function show() {
      lbImg.src = images[lbIdx];
      lbCount.textContent = (lbIdx + 1) + ' / ' + images.length;
    }
    function closeLb() { lb.classList.remove('active'); }
    function stepLb(d) { lbIdx = (lbIdx + d + images.length) % images.length; show(); }

    byId('lb-close').addEventListener('click', closeLb);
    byId('lb-prev').addEventListener('click', function () { stepLb(-1); });
    byId('lb-next').addEventListener('click', function () { stepLb(1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') stepLb(-1);
      if (e.key === 'ArrowRight') stepLb(1);
    });

    /* ── Boot: #slug deep-links a panel, otherwise Jenni ── */
    function fromHash() { return (location.hash || '').replace('#', '').toLowerCase(); }
    var initial = fromHash();
    var valid = ARTISTS.some(function (a) { return a.slug === initial; });
    open(valid ? initial : ARTISTS[0].slug, false);

    window.addEventListener('hashchange', function () {
      var s = fromHash();
      if (ARTISTS.some(function (a) { return a.slug === s; })) open(s, false);
    });
  })();
  </script>
</body>
</html>
